<title>Lanka Remit</title>
<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1420; --surface:#18202F; --ink:#E8ECF3; --muted:#9AA6BA; --line:#2B3548;

}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Sans Tamil","Noto Sans Sinhala","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Malayalam","Latha","Iskoola Pota","Nirmala UI","Segoe UI",system-ui,sans-serif;
  background:var(--surface);color:var(--ink);line-height:1.55;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--brand);color:var(--brand-ink);padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:18px}
.top p{font-size:13px;opacity:.9;margin-top:4px}
.lang{width:auto;padding:6px 10px;border-radius:8px;border:0;background:rgba(255,255,255,.2);color:inherit;font:inherit;font-size:14px}
.lang option{color:#14213D}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:13px 4px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);font-weight:700;border-bottom-color:var(--mark)}
.page{display:none;padding:18px;flex:1}
.page.on{display:block}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
h2{font-size:15px;margin:22px 0 10px}
.prov{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.prov-head{display:flex;justify-content:space-between;align-items:center}
.prov-head b{font-size:15px}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
.prov .two label{margin-top:6px}
.res{list-style:none}
.res li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.res li.best{border-color:var(--ok);background:var(--okbg)}
.res .n{font-weight:700}
.res .s{font-size:12px;color:var(--muted)}
.res .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-inline-start:6px}
.go{display:inline-block;margin-top:6px;padding:7px 14px;border-radius:8px;background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:13px;text-decoration:none}
.btn{width:100%;padding:12px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--brand);font:inherit;font-weight:700;cursor:pointer}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.tips{list-style:none}
.tips li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;display:flex;gap:10px}
.tips li span{color:var(--mark);font-weight:700}
.disc{font-size:12px;color:var(--muted);margin-top:22px;padding-top:12px;border-top:1px solid var(--line)}
</style>
</head>

</div>

en:"Your language not listed? Use your browser's Translate feature.",
hi:"आपकी भाषा सूची में नहीं है? ब्राउज़र की Translate सुविधा इस्तेमाल करें।",
ml:"നിങ്ങളുടെ ഭാഷ പട്ടികയിലില്ലേ? ബ്രൗസറിലെ Translate സൗകര്യം ഉപയോഗിക്കുക.",
ar:"لغتك غير موجودة؟ استخدم ميزة الترجمة في المتصفح.",
it:"La tua lingua non è nell'elenco? Usa la funzione Traduci del browser.",
ko:"찾는 언어가 없나요? 브라우저의 번역 기능을 사용해 보세요.",
ja:"お使いの言語がありませんか？ブラウザの翻訳機能をご利用ください。",
fr:"Votre langue n'est pas dans la liste ? Utilisez la fonction Traduire de votre navigateur.",
de:"Ihre Sprache fehlt ? Nutzen Sie die Übersetzungsfunktion Ihres Browsers.".replace(" ?","?"),
ms:"Bahasa anda tiada dalam senarai? Gunakan ciri Terjemah pelayar anda."
};
const CURS=["USD","GBP","EUR","AUD","CAD","SAR","AED","QAR","KWD","OMR","SGD","JPY"];
const DEFAULT_PROVS=["Wise","Remitly","WorldRemit","Western Union","MoneyGram","Xoom","OrbitRemit"];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="lankaremit.v1";
const uid=()=>Math.random().toString(36).slice(2,8);

function fresh(){
  const guess=(navigator.language||"en").slice(0,2);
  return{lang:T[guess]?guess:"ta",amt:"",cur:"USD",mid:"",
    provs:DEFAULT_PROVS.map(n=>({id:uid(),name:n,fee:"",rate:""}))};
}
let S;
try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const t=k=>T[S.lang][k];
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const lkr=n=>"Rs. "+Math.round(n).toLocaleString("en-US");

/* ---- மொழி ---- */
function applyLang(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  $("lang").value=S.lang;
  $("sub").textContent=t("sub");
  $("tCmp").textContent=t("tCmp");$("tSafe").textContent=t("tSafe");
  $("lAmt").textContent=t("amt");$("lMid").textContent=t("mid");$("hMid").textContent=t("hMid");
  $("hRes").textContent=t("res");$("hProv").textContent=t("prov");
  $("add").textContent=t("add");
  $("disc").textContent=t("disc");
  $("more").textContent=MORE[S.lang]||MORE.en;
  $("tips").innerHTML=T[S.lang].tips.map((x,i)=>`<li><span>${i+1}</span><div>${esc(x)}</div></li>`).join("");
  renderProvs();calc();
}

/* ---- சேவைகள் ---- */
function renderProvs(){
  $("provs").innerHTML=S.provs.map(p=>`
    <div class="prov" data-id="${p.id}">
      <div class="prov-head"><b>${esc(p.name)}</b><button class="x" data-del="${p.id}" aria-label="${esc(t("del"))}">✕</button></div>
      <div class="two">
        <div><label>${esc(t("fee"))} (${esc(S.cur)})</label><input type="number" inputmode="decimal" min="0" step="any" data-f="fee" value="${esc(p.fee)}"></div>
        <div><label>${esc(t("rate"))} (LKR)</label><input type="number" inputmode="decimal" min="0" step="any" data-f="rate" value="${esc(p.rate)}"></div>
      </div>
    </div>`).join("");
  $("provs").querySelectorAll("input").forEach(inp=>inp.oninput=()=>{
    const p=S.provs.find(x=>x.id===inp.closest(".prov").dataset.id);
    p[inp.dataset.f]=inp.value;save();calc();
  });
  $("provs").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    S.provs=S.provs.filter(x=>x.id!==b.dataset.del);save();renderProvs();calc();
  });
}
$("add").onclick=()=>{
  const n=(prompt(t("addAsk"))||"").trim();
  if(!n)return;
  S.provs.push({id:uid(),name:n.slice(0,30),fee:"",rate:""});
  save();renderProvs();
};

/* ---- கணக்கு ---- */
function calc(){
  const amt=num(S.amt),mid=num(S.mid);
  const rows=S.provs.map(p=>{
    const rate=num(p.rate),fee=num(p.fee);
    if(!(amt>0)||!(rate>0))return null;
    const recv=Math.max(0,amt-fee)*rate;
    const ideal=mid>0?amt*mid:0;
    return{p,recv,hidden:ideal>0?(ideal-recv)/ideal*100:null};
  }).filter(Boolean).sort((a,b)=>b.recv-a.recv);

  if(!rows.length){$("res").innerHTML=`<li class="empty" style="display:block;border:0">${esc(t("none"))}</li>`;return}
  const top=rows[0].recv;
  $("res").innerHTML=rows.map((r,i)=>{
    const link=LINKS[r.p.name];
    const diff=top-r.recv;
    const sub=[
      r.hidden!==null?`${t("hidden")}: ${r.hidden.toFixed(1)}%`:"",
      i>0?`−${lkr(diff)} ${t("less")}`:""
    ].filter(Boolean).join(" · ");
    return `<li class="${i===0?"best":""}">
      <div><span class="n">${esc(r.p.name)}</span>${i===0?`<span class="badge">${esc(t("best"))}</span>`:""}
        <div class="s">${esc(sub)}</div>
        ${link?`<a class="go" href="${esc(link)}" target="_blank" rel="noopener sponsored">${esc(t("send"))}</a>`:""}
      </div>
      <div style="text-align:end"><div class="s">${esc(t("recv"))}</div><div class="big">${lkr(r.recv)}</div></div>
    </li>`;
  }).join("");
}

/* ---- நிகழ்வுகள் ---- */
$("cur").innerHTML=CURS.map(c=>`<option>${c}</option>`).join("");
$("cur").value=S.cur;$("amt").value=S.amt;$("mid").value=S.mid;
$("cur").onchange=()=>{S.cur=$("cur").value;save();renderProvs();calc()};
$("amt").oninput=()=>{S.amt=$("amt").value;save();calc()};
$("mid").oninput=()=>{S.mid=$("mid").value;save();calc()};
$("lang").onchange=()=>{S.lang=$("lang").value;save();applyLang()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.p));
});

applyLang();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
